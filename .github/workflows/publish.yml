name: Publish to npm and GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch: 

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # GitHub Packagesへの書き込みに必須
      id-token: write      # npmのTrusted Publishing（トークンレス）に必須

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies & Build
        run: |
          bun install --frozen-lockfile
          bun run build

      # ----------------------------------------------------
      # 1. GitHub Packages へパブリッシュ（先に行うのが安全）
      # ----------------------------------------------------
      # package.jsonのデフォルト設定（@wataamee777/dscr ＆ publishConfig）のまま流します
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------
      # 2. npmjs.com へパブリッシュ
      # ----------------------------------------------------
      # npmjs.com用に、publishConfigを削除し、スコープ（@wataamee777/）を外して純粋な「dscr」にします
      - name: Modify package.json for npmjs.com
        run: |
          jq 'del(.publishConfig) | .name = "dscr"' package.json > package.json.tmp
          mv package.json.tmp package.json
          cat package.json | grep -E '"name"|"registry"' # 確認ログ

      - name: Publish to npmjs.com
        # 引数の --registry は削除し、--access public のみにします
        run: npm publish --access public
        env:
          # 環境変数でレジストリを明示することで、OIDC認証が正常に機能します
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
